<div class="text-center mb-8">
  <h2 class="text-3xl font-bold">{{ 'auth.login.signIn' | translate }}</h2>
  <p class="text-base-content/70 mt-2">{{ 'auth.login.loginToContinue' | translate }}</p>
</div>

<div class="mt-8">
  <button type="button" class="btn btn-primary w-full" (click)="login()">
    <img ngSrc="favicon.png" width="24" height="24" alt="FurrifyAuth" class="h-6 w-auto shrink-0 mr-2" />
    {{ 'auth.login.continueWithPurifyAuth' | translate }}
  </button>
</div>
