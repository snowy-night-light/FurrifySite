<form class="flex flex-col gap-6 pt-2 pb-4">
    <ui-label [text]="'app.dashboard.tags.tabs.tags.name' | translate" type="float">
        <ui-input-field [type]="'text'" [formField]="tagForm.name" [placeholder]="'app.dashboard.tags.tabs.tags.tagName' | translate"></ui-input-field>
    </ui-label>

    <ui-dynamic-dropdown
        [dataset]="categoryDataset"
        [mapDisplayItem]="mapTagCategoryToDisplayItem"
        (itemSelected)="updateCategory($event)"
        (itemUnselect)="clearCategory()" [searchGroup]="[{field: 'name', valueType: 'string'}]">
        <ui-label [text]="'app.dashboard.tags.tabs.tags.category' | translate" type="float">
            <ui-input-field
                [type]="'text'"
                [formField]="tagForm.categoryName"
                [placeholder]="'app.dashboard.tags.tabs.tags.selectCategory' | translate">
            </ui-input-field>
        </ui-label>
    </ui-dynamic-dropdown>



    @if (data().data?.id) {
        <div class="flex flex-col gap-1">
            <div class="flex items-center gap-2">
                <span class="label-text">Aliases</span>
                <button type="button" class="add-alias-btn btn btn-sm btn-outline btn-primary rounded-full" (click)="createAlias()">
                    <i class="bi bi-plus text-base"></i> {{ 'app.dashboard.tags.tabs.aliases.addAlias' | translate }}
                </button>
            </div>
            <div class="flex flex-wrap tag-aliases items-center gap-2 mt-1">
                @for (alias of aliases(); track alias.id) {
                    <div class="badge badge-primary gap-1 pl-2 pr-1 h-7 shadow-sm cursor-pointer hover:brightness-110 transition-all" (click)="navigateToAlias(alias.alias!)">
                        <span class="alias-text truncate max-w-50 font-medium text-sm">{{ alias.alias }}</span>
                        @if (removingAliasId() === alias.id) {
                            <span class="loading loading-spinner w-3.5 h-3.5 ml-1"></span>
                        } @else {
                            <button type="button" class="rounded-full w-5 h-5 flex items-center justify-center hover:bg-base-100/20 cursor-pointer transition-colors ml-1" (click)="$event.stopPropagation(); removeAlias(alias.id!)">
                                <i class="bi bi-x text-lg leading-none"></i>
                            </button>
                        }
                    </div>
                }

                @if (aliases().length === 0) {
                    <span class="no-aliases-text text-sm opacity-60">{{ 'app.dashboard.tags.tabs.tags.noAliases' | translate }}</span>
                }
            </div>

            @if (aliasDataset.getPageSignal()(); as pageData) {
                <div class="mt-2">
                    <ui-pagination
                        [pageData]="pageData"
                        [small]="true"
                        (pageChange)="onAliasPageChange($event)">
                    </ui-pagination>
                </div>
            }
        </div>
    }
</form>

<ui-modal-dialog
    #aliasDialog
    [titleKey]="'app.dashboard.tags.tabs.aliases.createAlias'"
    [data]="aliasDialogData()"
    [component]="aliasEditComponent"
    [onSave]="onAliasSave.bind(this)"
></ui-modal-dialog>
