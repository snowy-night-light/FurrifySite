<label class="swap swap-rotate">
  <!-- this hidden checkbox controls the state -->
  <input type="checkbox" class="theme-controller" value="light" />

  <!-- sun icon -->
  <i class="bi bi-brightness-high-fill swap-off h-10 w-10 fill-current"></i>

  <!-- moon icon -->
  <i class="bi bi-moon-fill swap-on h-10 w-10 fill-current"></i>
</label>
