<div class="flex flex-col gap-2 w-full">
    @if (title()) {
        <span class="label-text font-medium">{{ title() }}</span>
    }

    <form class="flex items-start gap-2 w-full" (ngSubmit)="addItem()">
        <ui-label [text]="placeholder()" type="float" class="flex-1">
            <ui-input-field [type]="'text'" [placeholder]="placeholder()" [formField]="inputForm.newItem"></ui-input-field>
        </ui-label>
        <button type="submit" class="btn btn-primary h-10 min-h-10 w-10 min-w-10"
                [disabled]="!inputForm().valid() || !inputModel().newItem.trim()">
            <i class="bi bi-plus-lg text-lg"></i>
        </button>
    </form>

    <div class="flex flex-wrap items-center gap-2 mt-2">
        @for (item of items(); track item; let i = $index) {
            <div class="badge badge-primary gap-1 pl-2 pr-1 h-7 shadow-sm">
                <span class="truncate max-w-50 font-medium text-sm">{{ item }}</span>
                <button type="button" class="rounded-full w-5 h-5 flex items-center justify-center hover:bg-base-100/20 cursor-pointer transition-colors ml-1" (click)="removeItem(i)">
                    <i class="bi bi-x text-lg leading-none"></i>
                </button>
            </div>
        }

        @if (items().length === 0 && emptyText()) {
            <span class="text-sm opacity-60">{{ emptyText() }}</span>
        }
    </div>
</div>
