@let size = this.size();
@let color = this.color();

<label class="flex items-center gap-3 w-full transition-all focus-within:outline-none!" [ngClass]="{
                'input': type() !== 'file',
                'px-5': type() !== 'file',
                'input-bordered border-2': bordered() && type() !== 'file',
                'input-xs': size === 'xs' && type() !== 'file',
                'input-sm': size === 'sm' && type() !== 'file',
                'input-md': size === 'md' && type() !== 'file',
                'input-lg': size === 'lg' && type() !== 'file',
                'input-xl': size === 'xl' && type() !== 'file',
                'focus-within:input-neutral': color === 'neutral' && type() !== 'file',
                'focus-within:input-primary': color === 'primary' && type() !== 'file',
                'focus-within:input-secondary': color === 'secondary' && type() !== 'file',
                'focus-within:input-accent': color === 'accent' && type() !== 'file',
                'focus-within:input-info': color === 'info' && type() !== 'file',
                'focus-within:input-success': color === 'success' && type() !== 'file',
                'focus-within:input-warning': color === 'warning' && type() !== 'file',
                'focus-within:input-ghost': color === 'transparent' && type() !== 'file',
                'input-error': ((color === 'error') || invalid()) && type() !== 'file',
                'rounded-full': rounded() && type() !== 'file'
           }">
    @let iconClass = this.iconClass();

    @if (iconClass && iconClass.length > 0) {
        <i [class]="['opacity-50', ...iconClass].join(' ')"></i>
    }

    @if (type() !== 'file') {
        <input class="grow outline-none bg-transparent" [type]="type() === 'color' ? 'text' : type()" [placeholder]="placeholder()" [autocomplete]="autocomplete()"
               [attr.list]="datasetId()" [disabled]="disabled()" (focus)="focus.emit($event)" (change)="change.emit($event)"
               [value]="value() ?? ''" (input)="onInput($event)" (blur)="onBlur()"/>
    } @else {
        <input type="file" class="grow outline-none bg-transparent w-full text-sm text-base-content/70 cursor-pointer
               file:mr-4 file:py-2 file:px-6
               file:rounded-full file:border file:border-base-content/20 file:font-semibold hover:file:bg-base-content/10 file:transition-colors" [placeholder]="placeholder()"
               [disabled]="disabled()" (focus)="focus.emit($event)" (change)="change.emit($event)"
               [accept]="accept()" [multiple]="multiple()"
               (input)="onInput($event)" (blur)="onBlur()"/>
    }

    @if (type() === 'color') {
        <div class="relative h-5 w-5 rounded-full overflow-hidden shrink-0">
            <input type="color"
                   class="color-picker-circle w-full h-full p-0 bg-transparent border-0 cursor-pointer"
                   [value]="value() || '#000000'"
                   (input)="onInput($event)"
                   title="Choose your color">
            <div class="absolute inset-0 pointer-events-none rounded-full shadow-inner border border-base-content/10"></div>
        </div>
    }
    @let datalist = this.datalist();

    @if (datalist) {
        <datalist [id]="datasetId()">
            @for (datasetItem of datalist; track datasetItem) {
                <option [value]="datasetItem"></option>
            }
        </datalist>
    }
</label>

@let validationFeedback = this.validationFeedback();
@if (validationFeedback && !hideValidation()) {
    <ui-validation-feedback [feedback]="validationFeedback"></ui-validation-feedback>
}
