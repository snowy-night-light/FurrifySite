@if (totalElements() > 0) {
    <div class="flex justify-center w-full pt-4">
        <div class="flex gap-1 shadow-sm border border-base-200 bg-base-100 p-1 rounded-full">
            <button type="button" class="btn btn-ghost rounded-full"
                    [class.h-8]="small()" [class.min-h-8]="small()" [class.px-2]="small()"
                    [class.h-10]="!small()" [class.min-h-10]="!small()" [class.px-3]="!small()"
                    [disabled]="!hasPrevious()"
                    (click)="goToPage(0)"
                    aria-label="First page">
                <i class="bi bi-chevron-double-left" [class.text-sm]="small()" [class.text-base]="!small()"></i>
            </button>

            <button type="button" class="btn btn-ghost rounded-full"
                    [class.h-8]="small()" [class.min-h-8]="small()" [class.px-2]="small()"
                    [class.h-10]="!small()" [class.min-h-10]="!small()" [class.px-3]="!small()"
                    [disabled]="!hasPrevious()"
                    (click)="goToPage(currentPage() - 1)"
                    aria-label="Previous page">
                <i class="bi bi-chevron-left" [class.text-sm]="small()" [class.text-base]="!small()"></i>
            </button>

            @for (p of pages(); track p) {
                <button type="button" class="btn rounded-full font-medium"
                        [class.h-8]="small()" [class.min-h-8]="small()" [class.w-8]="small()" [class.px-0]="small()" [class.text-sm]="small()"
                        [class.h-10]="!small()" [class.min-h-10]="!small()" [class.w-10]="!small()" [class.px-0]="!small()" [class.text-base]="!small()"
                        [class.btn-primary]="p === currentPage()"
                        [class.btn-ghost]="p !== currentPage()"
                        (click)="goToPage(p)">
                    {{ p + 1 }}
                </button>
            }

            <button type="button" class="btn btn-ghost rounded-full"
                    [class.h-8]="small()" [class.min-h-8]="small()" [class.px-2]="small()"
                    [class.h-10]="!small()" [class.min-h-10]="!small()" [class.px-3]="!small()"
                    [disabled]="!hasNext()"
                    (click)="goToPage(currentPage() + 1)"
                    aria-label="Next page">
                <i class="bi bi-chevron-right" [class.text-sm]="small()" [class.text-base]="!small()"></i>
            </button>

            <button type="button" class="btn btn-ghost rounded-full"
                    [class.h-8]="small()" [class.min-h-8]="small()" [class.px-2]="small()"
                    [class.h-10]="!small()" [class.min-h-10]="!small()" [class.px-3]="!small()"
                    [disabled]="!hasNext()"
                    (click)="goToPage(totalPages() - 1)"
                    aria-label="Last page">
                <i class="bi bi-chevron-double-right" [class.text-sm]="small()" [class.text-base]="!small()"></i>
            </button>
        </div>
    </div>
}
